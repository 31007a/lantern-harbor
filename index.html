<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>潮汐燈港</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101f35;color:#fff2d2;font:16px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header{position:absolute;top:20px;left:24px;pointer-events:none;text-shadow:0 2px 8px #101b32}h1{margin:0;font: bold 34px Georgia,serif;letter-spacing:.16em}small{letter-spacing:.24em}#count{position:absolute;right:24px;top:24px;background:#12253ded;padding:12px 16px;border:1px solid #eac790;border-radius:30px}#tip{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:max-content;max-width:92vw;background:#101f35e8;padding:12px 18px;border-radius:12px;text-align:center;pointer-events:none}.cover{position:absolute;inset:0;display:grid;place-items:center;background:#0e19375c;padding:20px}.cover[hidden]{display:none}article{max-width:440px;padding:30px;background:#11263eee;border:1px solid #efd6a780;border-radius:22px;box-shadow:0 20px 90px #0a162c80}p{line-height:1.6}button{border:0;border-radius:10px;background:#ffe2a5;color:#12253d;font:inherit;font-weight:700;padding:12px 18px;cursor:pointer;touch-action:none}#pad{position:absolute;bottom:68px;left:15px;display:none;gap:5px}#act{position:absolute;right:16px;bottom:74px;display:none}@media(pointer:coarse){#pad:not([hidden]),#act:not([hidden]){display:flex}#pad button{padding:11px}header{left:14px}h1{font-size:26px}#count{right:12px;top:15px}}
#act:disabled{opacity:.5}#tip{max-width:88vw} </style>
<canvas id="scene" aria-label="第一人稱海港場景"></canvas><header><small>THE TIDEKEEPER</small><h1>潮汐燈港</h1></header><div id="count">探索 · 魚市</div><div id="tip" role="status"></div>
<div id="pad" hidden><button data-key="a" aria-label="向左轉">↶</button><button data-key="w" aria-label="向前">▲</button><button data-key="s" aria-label="後退">▼</button><button data-key="d" aria-label="向右轉">↷</button></div><button id="act" hidden>互動</button>
<div class="cover" id="cover"><article><small>CHAPTER 01 · 歸航</small><h2 id="title">退潮後，海底有路。</h2><p id="desc">海霧蓋住了返航的路，而燈塔的燈芯失蹤了。先到魚市讀留言，再找出藏在潮水底下的路。</p><button id="start">走進燈港</button></article></div>
<script>
'use strict';
const $=id=>document.getElementById(id), c=$('scene'), g=c.getContext('2d');
const lamps=[], faces=[], solid=[], keys=new Set();
let x,z,yaw,active=false,prev=0,w,h,focus,audio;
function poly(color,...p){faces.push({color,p})}
function box(x,z,a,b,y,t,cs,block=false){
 const X=x+a,Z=z+b;poly(cs[0],[x,y,z],[X,y,z],[X,t,z],[x,t,z]);poly(cs[1],[x,y,Z],[X,y,Z],[X,t,Z],[x,t,Z]);poly(cs[2],[x,y,z],[x,y,Z],[x,t,Z],[x,t,z]);poly(cs[3],[X,y,z],[X,y,Z],[X,t,Z],[X,t,z]);poly(cs[4],[x,t,z],[X,t,z],[X,t,Z],[x,t,Z]);if(block)solid.push([x,z,X,Z]);
}
function uniform(k){return [k,k,k,k,k]}
function house(x,z,a,b,t,k,roof){
 box(x,z,a,b,0,t,[k,k,'#5b6371','#3d5265',k],true);const X=x+a,Z=z+b,M=x+a/2;
 poly(roof,[x,t,z],[M,t+1,z],[M,t+1,Z],[x,t,Z]);poly('#3d354a',[X,t,z],[M,t+1,z],[M,t+1,Z],[X,t,Z]);poly(roof,[x,t,z],[X,t,z],[M,t+1,z]);
 for(let j=.48;j<a-.45;j+=.85){poly('#f7be77',[x+j,1.15,z-.012],[x+j+.42,1.15,z-.012],[x+j+.42,1.82,z-.012],[x+j,1.82,z-.012]);poly('#f7be77',[x+j,1.15,Z+.012],[x+j+.42,1.15,Z+.012],[x+j+.42,1.82,Z+.012],[x+j,1.82,Z+.012]);}
}
for(let j=-5;j<35;j+=1){poly(j%2?'#71646c':'#786b70',[-9,0,j],[9,0,j],[9,0,j+1],[-9,0,j+1]);poly(j%2?'#a18e81':'#95867e',[-2,-.005+.016,j],[2,.011,j],[2,.011,j+1],[-2,.011,j+1]);}
for(let j=0;j<22;j+=4){
 house(-7.9,j,4.1,2.9,2.4+(j%3)*.25,['#907569','#95655d','#b18b70'][j%3],'#864b58');
 if(j<16)house(3.4,j+1,3.8,2.8,2.7,['#647e81','#8d7377','#6f8393'][j%3],'#425570');
}
for(let j=-4;j<34;j+=1.25){if(j>=21&&j<=26)continue;box(8.5,j,.13,.13,0,.86,uniform('#a39b97'));box(8.52,j,.09,1.25,.73,.81,uniform('#c0b0a5'))}
const tideFaces=[], marks=[
 {x:0,z:5,name:'魚市留言',id:'note'},
 {x:5.9,z:24,name:'舊水閘',id:'gate'},
 {x:19,z:24,name:'洞口石碑',id:'stone'},
 {x:23,z:22,name:'青水母',id:'cyan',color:'#65f0d4'},
 {x:27,z:24,name:'金水母',id:'gold',color:'#ffd47e'},
 {x:23,z:26,name:'紫水母',id:'violet',color:'#cb9eff'},
 {x:30,z:24,name:'失落燈芯',id:'core'},
 {x:36,z:24,name:'海上燈塔',id:'tower'}
];
const order=['violet','cyan','gold'];
let stage=0,tide=0,sequence=0,message='',until=0,preview=0;
for(let i=9;i<59;i+=2)for(let j=6;j<42;j+=3){
 poly((i+j)%4?'#39657a':'#437387',[i,.52,j],[i+2,.52,j],[i+2,.52,j+3],[i,.52,j+3]); tideFaces.push(faces.at(-1));
}
for(let i=9;i<39;i+=1){
 const wide=i>=18?4:1.78;
 poly(i%2?'#716760':'#857b70',[i,0,24-wide],[i+1,0,24-wide],[i+1,0,24+wide],[i,0,24+wide]);
 if(i<18)poly('#bdaa89',[i,.012,23.7],[i+1,.012,23.7],[i+1,.012,24.3],[i,.012,24.3]);
}
for(let i=18;i<32;i+=2){
 box(i,19.5,2,1.15,0,2.8+Math.sin(i)*.5,uniform(i%4?'#41465b':'#4b4a60'),true);
 box(i,27.5,2,1.15,0,2.5+Math.cos(i)*.55,uniform(i%4?'#3e4056':'#545169'),true);
 if(i<30)box(i,20.65,2,6.85,2.75,3.05,uniform('#35394e'));
}
box(34.8,22.8,2.4,2.4,0,4.6,['#c7ae9b','#c7ae9b','#958393','#ad9295','#554659']);
box(34.55,22.55,2.9,2.9,4.55,5.35,uniform('#90746c'));const towerFaces=faces.slice(-5);
box(34.4,22.4,3.2,3.2,5.35,5.54,uniform('#3f354f'));
for(const m of marks.slice(0,3))box(m.x-.27,m.z-.25,.54,.5,0,m.id==='gate'?1.2:.85,uniform(m.id==='gate'?'#b47549':'#77646c'));
function reset(){x=0;z=-3;yaw=0;stage=0;tide=0;sequence=0;preview=0;message='';until=0;active=true;$('cover').hidden=true;$('pad').hidden=false;$('act').hidden=false;keys.clear();refresh();}
function say(t,ms=6000){message=t;until=performance.now()+ms;}
function visible(m){return m.id==='note'||m.id==='gate'||m.id==='tower'||(stage>=2&&(m.id!=='core'||stage===3));}
function refresh(){
 const label=['魚市留言','尋找水閘','潮洞謎題','拾取燈芯','修復燈塔','已完成'][stage];
 $('count').textContent='探索 · '+label;
 focus=marks.filter(m=>visible(m)&&Math.hypot(m.x-x,m.z-z)<1.85).sort((a,b)=>Math.hypot(a.x-x,a.z-z)-Math.hypot(b.x-x,b.z-z))[0];
 const hint=['沿街前進，找魚市的留言','沿街往北，留意右側海堤','穿過露出的石路，進潮洞讀石碑','封印解開了，往洞的深處走','帶著燈芯繼續往海上燈塔走','燈塔亮了'][stage];
 const now=performance.now();const t=now<until?message:focus?'E / 互動：'+focus.name:hint;
 const pulse=now-preview;
 const flash=stage===2&&preview>0&&pulse<2400?['紫水母亮起','青水母亮起','金水母亮起'][Math.floor(pulse/800)]:null;
 if($('tip').textContent!==(flash||t))$('tip').textContent=flash||t;
 $('act').disabled=!focus;
}
function walkable(a,b){return ((a>-8.4&&a<9&&b>-4.6&&b<33.7)||(stage>=2&&tide>.9&&a>=8.9&&a<38.8&&Math.abs(b-24)<(a<18?1.65:3.65)))&&!solid.some(([X,Z,U,V])=>a>X-.26&&a<U+.26&&b>Z-.26&&b<V+.26);}
function foghorn(){try{const t=audio.currentTime,o=audio.createOscillator(),v=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(126,t);o.frequency.linearRampToValueAtTime(93,t+.95);v.gain.setValueAtTime(.001,t);v.gain.linearRampToValueAtTime(.1,t+.12);v.gain.exponentialRampToValueAtTime(.001,t+1.25);o.connect(v);v.connect(audio.destination);o.start(t);o.stop(t+1.26);}catch{}}
function chime(n){try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{});const t=audio.currentTime;for(let i=0;i<(n===3?3:2);i++){const o=audio.createOscillator(),v=audio.createGain();o.frequency.value=440*Math.pow(2,(i*4+n)/12);v.gain.setValueAtTime(.09,t+i*.12);v.gain.exponentialRampToValueAtTime(.001,t+i*.12+.28);o.connect(v);v.connect(audio.destination);o.start(t+i*.12);o.stop(t+i*.12+.3);}}catch{}}
function light(){
 if(!active||!focus)return;
 const id=focus.id;
 if(id==='note'){if(stage===0)stage=1;say('魚市留言：海堤欄杆缺口旁有舊水閘。拉下它，海底沉路就會浮現。',8500);chime(1);}
 else if(id==='gate'){if(stage===0){say('水閘上掛著魚市的標記。先去看看留言。');}else if(stage===1){stage=2;chime(0);say('潮水正在退去……看向欄杆缺口！');}}
 else if(id==='stone'&&stage===2){preview=performance.now();sequence=0;say('石碑：跟著水母亮起的順序喚醒牠們。漏看可以再讀一次。',5500);}
 else if(order.includes(id)&&stage===2){
  if(!preview){say('先讀洞口石碑，觀察水母亮起的順序。');}
  else if(performance.now()-preview<2400){say('先看完水母的光。');}
  else if(id===order[sequence]){sequence++;chime(sequence);if(sequence===3){stage=3;say('封印打開了！洞深處的燈芯亮起來了。');}else say('水母回應了你 · '+sequence+' / 3');}
  else{sequence=0;preview=performance.now();say('順序不對，水母再示範一次。');}
 }
 else if(id==='core'&&stage===3){stage=4;chime(2);say('拿到燈芯！把它帶到海上的燈塔。');}
 else if(id==='tower'){if(stage!==4){say('燈塔缺了一枚燈芯。');}else{stage=5;foghorn();active=false;$('pad').hidden=true;$('act').hidden=true;$('title').textContent='燈塔亮了。';$('desc').textContent='潮洞裡找回的燈芯重新照亮海面。遠處傳來一聲汽笛，船隻找到了回家的路。';$('start').textContent='再探索一次';$('cover').hidden=false;refresh();$('start').focus();}}
 refresh();
}
function frame(ms){
 let dt=Math.min(.045,(ms-prev)/1000);prev=ms;
 if(active){yaw+=2.0*dt*((keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0));let v=4.2*dt*((keys.has('w')||keys.has('arrowup')?1:0)-(keys.has('s')||keys.has('arrowdown')?1:0));let nx=x+Math.sin(yaw)*v,nz=z+Math.cos(yaw)*v;if(walkable(nx,z))x=nx;if(walkable(x,nz))z=nz;refresh();}
 tide=Math.min(1,tide+(stage>=2?dt*.42:0));for(const f of tideFaces)for(const p of f.p)p[1]=.52-tide*1.26;for(const f of towerFaces)f.color=stage===5?'#fff0a7':'#90746c';
 const d=Math.min(devicePixelRatio||1,1.6);w=c.clientWidth*d|0;h=c.clientHeight*d|0;if(c.width!==w||c.height!==h){c.width=w;c.height=h;}
 const hy=h*.48,f=Math.min(w,h*1.3)*.86,C=Math.cos(yaw),S=Math.sin(yaw);
 const sky=g.createLinearGradient(0,0,0,hy);sky.addColorStop(0,'#162445');sky.addColorStop(.73,'#80697f');sky.addColorStop(1,'#dd9d87');g.fillStyle=sky;g.fillRect(0,0,w,hy);g.fillStyle='#455364';g.fillRect(0,hy,w,h-hy);
 for(let i=0;i<60;i++){let u=((i*0.618-yaw*.17)%1+1)%1;g.fillStyle=i%3?'#f3dbbe88':'#fff0c6';g.fillRect(u*w,((i*.137)%1)*hy*.64,1+i%3,1+i%2)}
 const moon=(((.72-yaw*.17)%1+1)%1)*w;g.fillStyle='#ffe4ac';g.beginPath();g.arc(moon,hy*.41,Math.min(w,h)*.035,0,7);g.fill();
 const cam=p=>{const a=p[0]-x,b=p[2]-z;return [a*C-b*S,p[1]-1.38,a*S+b*C]};
 const proj=p=>[w/2+p[0]*f/p[2],hy-p[1]*f/p[2]];
 function clip(p){let out=[];for(let i=0;i<p.length;i++){let a=p[i],b=p[(i+1)%p.length],A=a[2]>=.16,B=b[2]>=.16;if(A)out.push(a);if(A!==B){let t=(.16-a[2])/(b[2]-a[2]);out.push([a[0]+t*(b[0]-a[0]),a[1]+t*(b[1]-a[1]),.16]);}}return out;}
 for(const l of lamps)for(const p of l.panels)p.color=l.on?'#ffdb77':'#98736c';
 const view=faces.map(o=>({color:o.color,p:clip(o.p.map(cam))})).filter(o=>o.p.length>=3).map(o=>({...o,depth:o.p.reduce((s,p)=>s+p[2],0)/o.p.length})).sort((a,b)=>b.depth-a.depth);
 for(const o of view){let p=o.p.map(proj);g.beginPath();g.moveTo(...p[0]);for(const q of p.slice(1))g.lineTo(...q);g.closePath();g.fillStyle=o.color;g.fill();}
 for(const l of lamps){let p=cam([l.x,1.87,l.z]);if(p[2]<.4)continue;let [u,v]=proj(p);let r=Math.max(8,Math.min(70,130/p[2]));let glow=g.createRadialGradient(u,v,0,u,v,r);glow.addColorStop(0,l.on?'#ffe29ca9':'#a5ddfc30');glow.addColorStop(1,'#ffe29c00');g.fillStyle=glow;g.fillRect(u-r,v-r,r*2,r*2);g.fillStyle='#fff0cb';g.textAlign='center';g.font='bold '+Math.max(11,Math.min(17,100/p[2]))+'px system-ui';g.fillText(l.name+(l.on?' ✓':' ◇'),u,v-r*.62);}
 for(const m of marks){
  if(!visible(m)||m.id==='tower'&&stage<2)continue;
  const dist=Math.hypot(m.x-x,m.z-z);if(dist>13)continue;
  const p=cam([m.x,m.color?1.25:1.55,m.z]);if(p[2]<.5)continue;
  const [u,v]=proj(p), moment=performance.now()-preview, glow=preview&&moment>=0&&moment<2400&&order[Math.floor(moment/800)]===m.id, done=order.indexOf(m.id)>=0&&order.indexOf(m.id)<sequence, R=Math.min(35,38/p[2])*(glow?2:1);
  if(m.color||m.id==='core'){const col=m.color||'#ffe5a7', grad=g.createRadialGradient(u,v,0,u,v,Math.max(2,R*1.7));grad.addColorStop(0,col+(glow||done?'ff':'aa'));grad.addColorStop(1,col+'00');g.fillStyle=grad;g.fillRect(u-R*2,v-R*2,R*4,R*4);g.fillStyle=col;g.beginPath();g.arc(u,v,Math.max(2,R*.29),Math.PI,Math.PI*2);g.fill();}
  g.fillStyle=glow?'#ffffff':'#fff0d2';g.font='bold 14px system-ui';g.textAlign='center';g.fillText(m.name+(done?' ✓':''),u,v-13);
 }
 requestAnimationFrame(frame);
}
$('start').onclick=reset;$('act').onclick=light;
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(!active)return;if(['w','a','s','d','arrowup','arrowleft','arrowdown','arrowright','e'].includes(k)){e.preventDefault();keys.add(k);if(k==='e'&&!e.repeat)light();}});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());
for(const b of $('pad').querySelectorAll('button')){b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys.add(b.dataset.key);};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys.delete(b.dataset.key);}
let drag=null;c.onpointerdown=e=>{if(active){drag=e.clientX;c.setPointerCapture(e.pointerId);}};c.onpointermove=e=>{if(drag!==null&&active){yaw+=(e.clientX-drag)*.007;drag=e.clientX;}};c.onpointerup=c.onpointercancel=c.onlostpointercapture=()=>drag=null;
reset();active=false;$('cover').hidden=false;$('pad').hidden=true;$('act').hidden=true;$('tip').textContent='WASD / 方向鍵移動轉向 · 拖曳轉向 · E 互動';requestAnimationFrame(frame);
</script></html>
